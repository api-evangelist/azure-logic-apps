naftiko: "1.0.0-alpha1"

info:
  label: "Azure Logic Apps Management"
  description: "Workflow capability for managing Azure Logic Apps resources. Used by cloud engineers and DevOps teams."
  tags:
    - Azure
    - Cloud
    - Management
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AZURE_SUBSCRIPTION_ID: AZURE_SUBSCRIPTION_ID
      AZURE_ACCESS_TOKEN: AZURE_ACCESS_TOKEN

capability:
  consumes:
    - import: azure-logic-apps
      location: ./shared/azure-logic-apps.yaml

  exposes:
    - type: rest
      port: 8081
      namespace: azure-logic-apps-management-api
      description: "Unified REST API for Azure Logic Apps management."
      resources:
        - path: /v1/resources
          name: resources
          description: "Resource management"
          operations:
            - method: GET
              name: list
              description: "List all resources"
              call: "azure-logic-apps.list-workflows"
              with:
                subscriptionId: "rest.subscriptionId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9091
      namespace: azure-logic-apps-management-mcp
      transport: http
      description: "MCP server for AI-assisted Azure Logic Apps management."
      tools:
        - name: list-workflows
          description: "List Workflow resources"
          hints:
            readOnly: true
            openWorld: true
          call: "azure-logic-apps.list-workflows"
          with:
            subscriptionId: "tools.subscriptionId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-workflow-runs
          description: "List WorkflowRun resources"
          hints:
            readOnly: true
            openWorld: true
          call: "azure-logic-apps.list-workflow-runs"
          with:
            subscriptionId: "tools.subscriptionId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-workflow-triggers
          description: "List WorkflowTrigger resources"
          hints:
            readOnly: true
            openWorld: true
          call: "azure-logic-apps.list-workflow-triggers"
          with:
            subscriptionId: "tools.subscriptionId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-integration-accounts
          description: "List IntegrationAccount resources"
          hints:
            readOnly: true
            openWorld: true
          call: "azure-logic-apps.list-integration-accounts"
          with:
            subscriptionId: "tools.subscriptionId"
          outputParameters:
            - type: object
              mapping: "$."
